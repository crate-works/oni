name: Docker Image

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Semver version to publish (e.g. 2.2.0)
        required: true
        type: string
      ref:
        description: Git ref to build (defaults to the triggering commit)
        required: false
        type: string

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ steps.prepare.outputs.image_name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildkit-${{ steps.prepare.outputs.pair }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ steps.prepare.outputs.pair }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,"name={0}/{1}",push-by-digest=true,name-canonical=true,push=true', env.GHCR_REGISTRY, steps.prepare.outputs.image_name) || (matrix.platform == 'linux/amd64' && 'type=docker,name=oni-test' || '') }}

      - name: Check configuration overrides
        if: github.event_name == 'pull_request' && matrix.platform == 'linux/amd64'
        run: |
          echo '{"api":{"rocrate":{"endpoint":"https://base.example.test"}},"ui":{"title":"Oni"}}' > "${RUNNER_TEMP}/configuration.json"
          docker run -d --name oni --read-only --tmpfs /run --tmpfs /var/cache/nginx -p 8080:80 \
            -v "${RUNNER_TEMP}/configuration.json:/configuration.json:ro" \
            -e ONI_API_ENDPOINT=https://api.example.test \
            -e ONI_SENTRY_ENVIRONMENT=staging \
            -e ONI_OIDC_CLIENT_ID= \
            oni-test

          expected='{"api":{"rocrate":{"endpoint":"https://api.example.test"}},"ui":{"sentry":{"environment":"staging"},"title":"Oni"}}'
          actual=$(curl -sf --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/configuration.json | jq -cS .)
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected"
            echo "     got $actual"
            docker logs oni
            exit 1
          fi

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${DIGEST}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.prepare.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Prepare
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ steps.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ steps.prepare.outputs.major_minor }}
            type=raw,value=${{ steps.prepare.outputs.major }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          IMAGE_NAME: ${{ steps.prepare.outputs.image_name }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          IMAGE_NAME: ${{ steps.prepare.outputs.image_name }}
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "${GHCR_REGISTRY}/${IMAGE_NAME}:${VERSION}"
